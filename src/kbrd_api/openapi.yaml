# KBRD-API's own contract, by hand.
#
# Hand-written rather than generated: the routes here are plain Flask
# closures registered by each `api/*.py` class (see `main.py`), with no
# schema objects behind them to introspect — generating this would have
# meant rewriting every route as a Blueprint with a marshalling layer, a
# far larger change than the documentation is worth.
#
# The cost of writing it by hand is drift, which is what
# `tests/test_openapi.py` exists to stop: it walks the live app's own
# URL map and fails on any route missing here, any path documented that
# no route serves, and any method mismatch between the two. Add a route,
# and that test tells you to come back here.
#
# Served by `api/docs.py` at `/api/openapi.yaml`, with Swagger UI over it
# at `/api/docs`.
openapi: 3.0.3

info:
  title: KBRD-API
  version: "1.0.0"
  description: |
    The keyboard's own HTTP API: the layouts and layers it stores, the
    plugins mapped onto each key, the media and fonts they draw with, the
    physical screen it renders to, and the two things that register
    themselves with it — the KBRD-DEV unit and the KBRD Agent running on
    the paired machine.

    Everything is served under `/api`. On a device, nginx proxies that
    prefix to this service and serves KBRD-WEB from `/`; in development
    Vite proxies it to `127.0.0.1:8081` (see `kbrd-web/vite.config.ts`).

    There is no authentication: KBRD-API listens on the device's own
    network and every caller on it is trusted. The one credential in play
    goes the other way — the KBRD Agent hands over a bearer token when it
    registers, which this service then uses to call *it* back.

servers:
  - url: /
    description: The device itself, or the Vite dev proxy.

tags:
  - name: Health
    description: Liveness.
  - name: Docs
    description: |
      This document, and the Swagger UI page over it. Listed here rather
      than left out because `tests/test_openapi.py` holds the spec to the
      app's whole URL map — a route that exists is a route that's
      documented, this one included.
  - name: Layout
    description: |
      A layout is a keyboard: its name and author, the physical size of a
      keycap and the gap between two, and how many fit each way. Exactly
      one layout is active at a time.
  - name: Layer
    description: |
      A layer is one layout's grid disposition plus everything mapped onto
      it. A layout is created with none and KBRD-WEB offers to add the
      first; once it has one, deleting the last is refused.
  - name: Keys
    description: |
      What sits on a key: an ordered list of plugin instances, each with
      its own config, plus the key's own properties. A key is addressed by
      its `key_ref`, a string KBRD-WEB assigns and this service only ever
      stores.
  - name: Media
    description: |
      Images and videos uploaded for `kbrd.render-image` /
      `kbrd.render-video`. Files are reference-counted: one stops being
      kept the moment no plugin config mentions it any more. Categories
      are the labels KBRD-WEB's own Media panel files them under, and are
      rows of their own — they outlive whatever is filed under them.
      Both are device-wide: neither belongs to a layout or a layer, so
      every layout sees the same library. There is always at least one
      category ("Default" on a fresh device); deleting the last is
      refused.
  - name: Fonts
    description: The fonts available to draw text with.
  - name: Display
    description: The physical screen's own size, shared by every layout.
  - name: Device
    description: |
      The KBRD-DEV unit, which pushes its screen resolution on startup and
      re-registers on an interval. A registration older than 30 seconds is
      stale, which is how a silent device is told apart from one that
      never connected.
  - name: Storage
    description: |
      How full the device's own partitions are — the boot and system
      partitions, and `/data`, which holds the database, the media library
      and the fonts. Read at the moment it is asked for; nothing is stored.
  - name: Setup
    description: |
      The first run. A keyboard out of the box has no layout, no screen
      declared and no network but its own hotspot, and KBRD-WEB shows a
      wizard instead of the app until it has been through all of it.

      What the wizard collects goes back in one call, at the end: until
      every step has been answered, none of them counts, and a wizard
      abandoned half-way leaves the device exactly as it was.

  - name: Network
    description: |
      The keyboard's own Wi-Fi. With no network saved — a keyboard out of
      the box — it brings up an access point of its own instead, on a
      fixed address, and serves DHCP on it so KBRD-WEB can be reached to
      be told which network to join. It falls back to that same access
      point when a saved network can't be joined, which is what makes a
      keyboard recoverable after a router changes.

      Saving does not take effect inside the request: joining a network
      takes the interface down, usually the very one the request came in
      on, so the answer is sent first and the change applied a moment
      later.

  - name: Agent
    description: |
      The KBRD Agent on the paired machine. Same push model as Device, and
      the same 30-second staleness window. The applications and browsers
      routes are proxied straight through to it — `503` when no agent is
      registered, `502` when one is but can't be reached.
  - name: Backup
    description: |
      The whole device, out as one archive and back in as one archive: the
      database (every layout, layer, key and plugin config) as
      `database.db`, and the media library's own files — which live
      outside it — under `media/`. Restoring puts both back, so a key that
      was given an image finds that image there.

paths:

  /api/health:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: getHealth
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/docs:
    get:
      tags: [Docs]
      summary: Swagger UI
      description: |
        An HTML page rendering the spec below. Its assets come from a CDN,
        so the *browser* needs internet access — the spec itself is served
        from the device and readable without any.
      operationId: getDocs
      responses:
        "200":
          description: The page.
          content:
            text/html:
              schema:
                type: string

  /api/openapi.yaml:
    get:
      tags: [Docs]
      summary: This document
      operationId: getOpenapiSpec
      responses:
        "200":
          description: The spec.
          content:
            application/yaml:
              schema:
                type: string

  /api/layout:
    get:
      tags: [Layout]
      summary: List every layout
      operationId: listLayouts
      responses:
        "200":
          description: Every layout, by name then id.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Layout"
    post:
      tags: [Layout]
      summary: Create a layout
      description: |
        A fresh layout is created with no layer at all — Layer mode
        offers to add the first one. Duplicating a layout is the other
        story: there the cascade carries the source's own layers.
      operationId: createLayout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LayoutWrite"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layout"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/layout/active:
    get:
      tags: [Layout]
      summary: The layout in use
      description: |
        The active layout if one is flagged, otherwise the one named
        "default", otherwise the first alphabetically — so this answers
        even when nothing has been activated yet.
      operationId: getActiveLayout
      responses:
        "200":
          description: The layout in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layout"
        "404":
          description: There are no layouts at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/layout/{layout_id}:
    parameters:
      - $ref: "#/components/parameters/LayoutId"
    get:
      tags: [Layout]
      summary: One layout
      operationId: getLayout
      responses:
        "200":
          description: The layout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layout"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Layout]
      summary: Update a layout
      description: |
        A full replacement of the layout's own settings — a field left out
        is *not* left alone, it falls back to the documented default
        (`unit_mm` 19.05, `gap_mm` 3, `max_columns`/`max_rows` null).
      operationId: updateLayout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LayoutWrite"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layout"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Layout]
      summary: Delete a layout
      description: Its layers, their plugins and their properties go with it.
      operationId: deleteLayout
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/layout/{layout_id}/activate:
    parameters:
      - $ref: "#/components/parameters/LayoutId"
    put:
      tags: [Layout]
      summary: Make this the active layout
      description: |
        Clears the active flag on every other layout, and on every layer —
        activating a layout deliberately leaves no layer active, so the
        next `GET /api/layer/active` falls back to the layout alone.
      operationId: activateLayout
      responses:
        "200":
          description: The now-active layout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layout"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/layout/{layout_id}/duplicate:
    parameters:
      - $ref: "#/components/parameters/LayoutId"
    post:
      tags: [Layout]
      summary: Copy a layout
      description: |
        Copies the layout's settings and every one of its layers — each
        keeping its own name, with all its plugins and key properties.
      operationId: duplicateLayout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NamedCopy"
      responses:
        "201":
          description: The new layout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layout"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/layout/{layout_id}/replace:
    parameters:
      - $ref: "#/components/parameters/LayoutId"
    post:
      tags: [Layout]
      summary: Overwrite a layout from another
      description: |
        The target keeps its own name and description; everything else —
        settings, layers, plugins, key properties — is replaced by the
        source's. The target's old layers are deleted outright, and any
        media only they referenced goes with them.
      operationId: replaceLayout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceSource"
      responses:
        "200":
          description: The overwritten layout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layout"
        "400":
          description: |
            No `source_id`, or a source identical to the target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/layout/{layout_id}/layer:
    parameters:
      - $ref: "#/components/parameters/LayoutId"
    get:
      tags: [Layer]
      summary: Every layer of one layout
      description: Each layer with its plugins and key properties included.
      operationId: listLayoutLayers
      responses:
        "200":
          description: The layout's layers, by name then id.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LayerDetail"
    post:
      tags: [Layer]
      summary: Add a layer to a layout
      operationId: createLayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LayerWrite"
      responses:
        "201":
          description: The new layer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayerDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No such layout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/layer:
    get:
      tags: [Layer]
      summary: Every layer, across every layout
      description: |
        Without plugins or key properties — the flat list KBRD-WEB's own
        layer pickers offer (`invoke-layer`, `invoke-layout`). For a
        layer's contents, ask for it by layout instead.
      operationId: listLayers
      responses:
        "200":
          description: Every layer, by name then id.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Layer"

  /api/layer/active:
    get:
      tags: [Layer]
      summary: What the keyboard is currently showing
      description: |
        The active layer and its layout. With no layer active, `layer` is
        `null` and `layout` still answers with the default one — which is
        the state right after a layout is activated.
      operationId: getActiveLayer
      responses:
        "200":
          description: The active layer, or just the layout.
          content:
            application/json:
              schema:
                type: object
                properties:
                  layer:
                    oneOf:
                      - $ref: "#/components/schemas/LayerDetail"
                      - type: "null"
                  layout:
                    $ref: "#/components/schemas/Layout"
        "404":
          description: There are no layouts at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Layer]
      summary: Deactivate every layer
      description: |
        Leaves the active *layout* alone — this is "show no layer", not
        "show nothing".
      operationId: deactivateLayer
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/layer/{layer_id}:
    parameters:
      - $ref: "#/components/parameters/LayerId"
    put:
      tags: [Layer]
      summary: Rename a layer
      description: |
        Name and description only — a layer's grid has its own route, and
        its contents are edited a key at a time.
      operationId: updateLayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LayerWrite"
      responses:
        "200":
          description: The updated layer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayerDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Layer]
      summary: Delete a layer
      description: |
        Refused for a layout's last layer: there'd be nothing left to
        configure in Layer mode.
      operationId: deleteLayer
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          description: This is the layout's last layer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/layer/{layer_id}/activate:
    parameters:
      - $ref: "#/components/parameters/LayerId"
    put:
      tags: [Layer]
      summary: Make this the active layer
      description: |
        Activates its layout too, so the pair is always consistent.
      operationId: activateLayer
      responses:
        "200":
          description: The now-active layer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayerDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/layer/{layer_id}/factory-layout:
    parameters:
      - $ref: "#/components/parameters/LayerId"
    put:
      tags: [Layer]
      summary: Store the layer's grid disposition
      description: |
        KBRD-WEB's own Factory grid — rows, cells, merges, divisions.
        Opaque to this service, stored and handed back as-is. `null`
        clears it.
      operationId: updateFactoryLayout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                factory_layout:
                  oneOf:
                    - type: object
                      additionalProperties: true
                    - type: "null"
      responses:
        "200":
          description: The updated layer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayerDetail"
        "400":
          description: "`factory_layout` was neither an object nor null."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such layer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/layer/{layer_id}/duplicate:
    parameters:
      - $ref: "#/components/parameters/LayerId"
    post:
      tags: [Layer]
      summary: Copy a layer
      description: |
        Into the same layout, with the source's grid, plugins and key
        properties, under a new name.
      operationId: duplicateLayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NamedCopy"
      responses:
        "201":
          description: The new layer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayerDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/layer/{layer_id}/replace:
    parameters:
      - $ref: "#/components/parameters/LayerId"
    post:
      tags: [Layer]
      summary: Overwrite a layer from another
      description: |
        The target keeps its name and its place in its own layout;
        everything else — grid, plugins, key properties — comes from the
        source. Media only the target referenced is dropped.
      operationId: replaceLayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceSource"
      responses:
        "200":
          description: The overwritten layer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayerDetail"
        "400":
          description: No `source_id`, or a source identical to the target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/layer/{layer_id}/keys/{key_ref}:
    parameters:
      - $ref: "#/components/parameters/LayerId"
      - $ref: "#/components/parameters/KeyRef"
    delete:
      tags: [Keys]
      summary: Clear a key
      description: |
        Drops every plugin on it and its own properties. Media those
        plugins referenced is deleted unless another plugin still points
        at it.
      operationId: clearKey
      responses:
        "200":
          description: The layer, as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayerDetail"
        "404":
          description: No such layer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/layer/{layer_id}/keys/{key_ref}/plugins:
    parameters:
      - $ref: "#/components/parameters/LayerId"
      - $ref: "#/components/parameters/KeyRef"
    post:
      tags: [Keys]
      summary: Attach a plugin to a key
      description: |
        Appended last, which is also the order they draw in — the last
        plugin is on top.
      operationId: addKeyPlugin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plugin_id]
              properties:
                plugin_id:
                  type: string
                  description: The manifest id, e.g. `kbrd.render-label`.
                  example: kbrd.render-label
                plugin_version:
                  type: string
                  default: "1.0.0"
                config:
                  $ref: "#/components/schemas/PluginConfig"
      responses:
        "201":
          description: The new plugin instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyPlugin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No such layer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/layer/{layer_id}/keys/{key_ref}/plugins/duplicate-from:
    parameters:
      - $ref: "#/components/parameters/LayerId"
      - $ref: "#/components/parameters/KeyRef"
    post:
      tags: [Keys]
      summary: Copy another key's plugins onto this one
      description: |
        The source key's plugins are inserted *before* whatever this key
        already carries, and its key properties are copied over too.
      operationId: duplicateKeyPlugins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_key_ref]
              properties:
                source_key_ref:
                  type: string
      responses:
        "201":
          description: Every plugin on the layer afterwards.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KeyPlugin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No such layer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/layer/{layer_id}/keys/{key_ref}/move-to:
    parameters:
      - $ref: "#/components/parameters/LayerId"
      - $ref: "#/components/parameters/KeyRef"
    post:
      tags: [Keys]
      summary: Move a key's contents onto another key
      description: |
        Plugins are prepended to the destination's own; the destination's
        key properties are replaced by the source's, if it had any.
      operationId: moveKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination_key_ref]
              properties:
                destination_key_ref:
                  type: string
      responses:
        "200":
          description: The layer, as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayerDetail"
        "400":
          description: |
            No `destination_key_ref`, or one identical to the source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such layer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/layer/{layer_id}/keys/{key_ref}/properties:
    parameters:
      - $ref: "#/components/parameters/LayerId"
      - $ref: "#/components/parameters/KeyRef"
    put:
      tags: [Keys]
      summary: Set a key's own properties
      description: |
        The key's config as opposed to any plugin's — created on first
        write, replaced wholesale on every one after.
      operationId: updateKeyProperties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  $ref: "#/components/schemas/PluginConfig"
      responses:
        "200":
          description: What was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyProperty"
        "400":
          description: The config could not be serialised.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such layer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/key-plugin/{plugin_id}:
    parameters:
      - name: plugin_id
        in: path
        required: true
        description: A plugin *instance*'s id — not the manifest id.
        schema:
          type: integer
    put:
      tags: [Keys]
      summary: Update a plugin instance
      description: |
        Every field is optional and left alone when absent, `config`
        included. Media the previous config referenced and the new one
        doesn't is deleted, unless another plugin still points at it.
      operationId: updateKeyPlugin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                position:
                  type: integer
                  description: Draw order within the key; last is on top.
                enabled:
                  type: boolean
                config:
                  $ref: "#/components/schemas/PluginConfig"
      responses:
        "200":
          description: The updated instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyPlugin"
        "400":
          description: The config could not be serialised.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Keys]
      summary: Detach a plugin instance
      operationId: deleteKeyPlugin
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/media:
    get:
      tags: [Media]
      summary: List the media library
      description: |
        Every media the Media panel holds — what was uploaded *with* a
        category (see the `category_id` field below). A file uploaded
        without one is stored but not filed, and does not appear here.
      operationId: listMedias
      responses:
        "200":
          description: Every media, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Media"
    post:
      tags: [Media]
      summary: Upload an image or a video
      description: |
        Accepted as an image: `.png`, `.jpeg`, `.jpg` — and the declared
        MIME type has to agree (`image/…`).

        Accepted as a video: `.mp4`, `.m4v`, `.mov`, `.mkv`, `.webm`,
        `.avi` — the containers the device has a native demuxer for. The
        declared type is held to `video/…` only when there is one:
        whether a browser can name `.mkv` or `.avi` depends on the machine
        it runs on, and one that can't sends nothing.

        The lists are what the device itself can render — Kivy's
        SDL2_image loader for images, its gstplayer for videos — so
        nothing is stored that could not then be drawn. A container says
        nothing about the codec inside it, which is as far as an extension
        check can see.

        The file is kept under a generated name, which is what a plugin
        config then refers to. Bodies are capped at 32 MiB.
      operationId: uploadMedia
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                category_id:
                  type: integer
                  description: |
                    Files the media in the library under this category,
                    keeping the name it was uploaded under. Omit it to
                    store the file alone — which is what the plugin
                    editors do, and why they still get `{filename}` back.
      responses:
        "201":
          description: |
            Stored. With a `category_id`, the library entry that was
            created; without one, just the generated filename.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Media"
                  - type: object
                    properties:
                      filename:
                        type: string
                        example: 4f1c9e7a2b0d4e5f8a1b2c3d4e5f6a7b.png
        "400":
          description: |
            No file, not an accepted image/video, or no such category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The file could not be written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/media/{filename}:
    parameters:
      - name: filename
        in: path
        required: true
        description: |
          The generated name a `POST /api/media` handed back — the file
          itself, and the library entry holding it.
        schema:
          type: string
    get:
      tags: [Media]
      summary: Fetch an uploaded file
      operationId: getMedia
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: No such file.
    put:
      tags: [Media]
      summary: Replace a media's file
      description: |
        The same library entry with a new file behind it — what the Media
        panel does when one media is dropped onto another's square. The
        entry keeps its id and its category; it takes the new file's
        generated name and the name that file was dropped under.

        The new file has to pass the same checks an upload does, and to be
        of the same kind as the one it replaces: a photo for a photo, a
        video for a video.

        The file that was there is dropped unless a plugin config still
        draws with it — a key that was given that media keeps what it was
        given.
      operationId: replaceMedia
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Replaced — the library entry as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "400":
          description: |
            No file, not an accepted image/video, or not the kind it would
            be replacing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No library entry holds that file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The file could not be written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Media]
      summary: Delete a media
      description: |
        Drops the library entry, and its file with it unless a plugin
        config still draws with that file.
      operationId: deleteMedia
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "404":
          description: No library entry holds that file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/media-category:
    get:
      tags: [Media]
      summary: List every media category
      description: Ordered by name, the order KBRD-WEB's own picker lists them in.
      operationId: listMediaCategories
      responses:
        "200":
          description: Every category.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaCategory"
    post:
      tags: [Media]
      summary: Create a media category
      operationId: createMediaCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaCategoryInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaCategory"
        "400":
          description: Missing or empty name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Another category already goes by that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/media-category/{category_id}:
    parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [Media]
      summary: Rename a media category
      operationId: updateMediaCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaCategoryInput"
      responses:
        "200":
          description: Renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaCategory"
        "400":
          description: Missing or empty name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Another category already goes by that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Media]
      summary: Delete a media category
      description: |
        Takes its medias with it, and each of their files unless a plugin
        config still draws with one.
      operationId: deleteMediaCategory
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: |
            This is the last category — the library always keeps one, so
            there is always somewhere to file a media.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/fonts:
    get:
      tags: [Fonts]
      summary: List the available fonts
      description: |
        The bundled faces and any uploaded alongside them, `.ttf` and
        `.otf`, de-duplicated by filename — an upload shadowing a bundled
        face of the same name, as it does when the file itself is
        fetched.

        Each face is named as *it* names itself, read out of its own
        `name` table rather than guessed from its filename: `family` and
        `style` are what the editors' two-field font picker takes, and
        `label` is the same thing on one line for the pickers with room
        for one. Ordered by family, and within a family the way a
        specimen is — romans before italics, each run light to heavy.
      operationId: listFonts
      responses:
        "200":
          description: The fonts.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    value:
                      type: string
                      description: The filename, which is what a config stores.
                      example: Inter_18pt-SemiBold.ttf
                    label:
                      type: string
                      description: |
                        Family and style on one line, with a plain
                        "Regular" left off.
                      example: Inter 18pt SemiBold
                    family:
                      type: string
                      description: |
                        The face's typographic family — what the picker
                        groups by. Falls back to the filename's stem for a
                        file that carries no readable name table.
                      example: Inter 18pt
                    style:
                      type: string
                      description: |
                        The face within that family. Empty where the file
                        names no style, which the editors show as
                        "Regular" — their own word for it, not the
                        font's.
                      example: SemiBold

  /api/fonts/{filename}:
    parameters:
      - name: filename
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Fonts]
      summary: Fetch a font file
      description: |
        Uploaded fonts take precedence over bundled ones of the same name.
      operationId: getFont
      responses:
        "200":
          description: The font file.
          content:
            font/ttf:
              schema:
                type: string
                format: binary
        "400":
          description: |
            A name with a path in it, or an extension other than
            `.ttf`/`.otf`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such font.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/display:
    get:
      tags: [Display]
      summary: The screen's physical size
      operationId: getDisplay
      responses:
        "200":
          description: The size, in millimetres.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Display"
    put:
      tags: [Display]
      summary: Set the screen's physical size
      description: |
        A full replacement: a field left out falls back to its default
        (216 x 135 mm), it isn't left alone.
      operationId: updateDisplay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Display"
      responses:
        "200":
          description: The stored size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Display"
        "400":
          description: A dimension was not a number, or not above zero.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/device:
    get:
      tags: [Device]
      summary: Is a KBRD-DEV unit connected?
      description: |
        `connected` is `false` both when none ever registered and when the
        last registration is more than 30 seconds old.
      operationId: getDevice
      responses:
        "200":
          description: The device's state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStatus"

  /api/device/register:
    post:
      tags: [Device]
      summary: Register a KBRD-DEV unit
      description: |
        Called by KBRD-DEV itself, on startup and then on an interval.
        The physical size is optional — not every panel reports it in its
        EDID — but sending one half means sending both, and both must be
        positive.
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [width, height]
              properties:
                width:
                  type: integer
                  description: Screen width, in pixels.
                height:
                  type: integer
                  description: Screen height, in pixels.
                width_mm:
                  type: integer
                height_mm:
                  type: integer
      responses:
        "200":
          description: Registered.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      ok:
                        type: boolean
                  - $ref: "#/components/schemas/DeviceSize"
        "400":
          description: A missing, non-numeric or non-positive dimension.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/storage:
    get:
      tags: [Storage]
      summary: How full each partition is
      description: |
        One entry per partition the image lays down, in the order they sit
        on the card. A mount point that isn't there — or that turns out to
        be part of a filesystem already listed, as `/boot` and `/data`
        usually are on a development machine — is left out, so the list can
        be shorter than three and is never empty on a device.
      operationId: getStorage
      responses:
        "200":
          description: A reading per partition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  partitions:
                    type: array
                    items:
                      $ref: "#/components/schemas/StoragePartition"

  /api/setup:
    get:
      tags: [Setup]
      summary: Has the keyboard been set up?
      description: |
        `configured` is false only on a device that has never been
        through the wizard — a fresh one, or one whose `/data` has been
        wiped. A database that predates the wizard counts as configured:
        it has been in use, and has no first run left to do.

        `display` is the screen as it currently stands, so the wizard can
        open on what is already there. `password_set` says whether the
        device has a password at all — never anything about it.

        A device already set up asks for the wizard again while a marker
        file sits at the service's own `reset_path` (`/data/reset.txt` on
        a keyboard): this then answers `configured: false` whatever the
        database holds, and completing the wizard is what removes it.
        There is no route for that on purpose — writing the file takes
        SSH, SFTP or the card itself.
      operationId: getSetup
      responses:
        "200":
          description: The first-run state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                  password_set:
                    type: boolean
                    description: >
                      Whether a password has been set for KBRD-WEB. The
                      digest itself never leaves the device.
                  display:
                    $ref: "#/components/schemas/Display"

    post:
      tags: [Setup]
      summary: Complete the first run
      description: |
        Writes the screen, the password KBRD-WEB is to ask for and, if one
        was given, the network to join, and marks the device configured. Everything is validated before
        anything is written: a body this refuses leaves the device
        untouched and still unconfigured, so the wizard starts over
        rather than handing over a device that is part set up.

        `password` may be `null` or left out — that says this device has
        none, and leaves whatever is stored as it was. It is kept as a
        PBKDF2 digest and a salt, never as it was sent, and nothing reads
        it back out.

        `network` may be `null` or left out — that says to stay on the
        hotspot for now, and is what `network_applied: false` in the
        answer reports. Otherwise the network is saved and applied a
        moment after this answers, exactly as `PUT /api/network` does:
        the caller should expect the connection to go away.
      operationId: completeSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display]
              properties:
                display:
                  $ref: "#/components/schemas/DisplayWrite"
                password:
                  type: string
                  nullable: true
                  minLength: 8
                  maxLength: 64
                  description: What KBRD-WEB asks for before the app.
                network:
                  nullable: true
                  allOf:
                    - $ref: "#/components/schemas/NetworkWrite"
      responses:
        "200":
          description: Set up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  configured:
                    type: boolean
                  display:
                    $ref: "#/components/schemas/Display"
                  network_applied:
                    type: boolean
                    description: |
                      Whether the caller is about to lose the connection
                      it asked over.
        "400":
          description: |
            A missing screen, a screen with no name, a size that isn't a
            number or isn't between 10 and 2000 mm, or a network the
            network route would itself refuse.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/network:
    get:
      tags: [Network]
      summary: What the Wi-Fi is doing, and what it was told to do
      description: |
        `mode` is `hotspot` while the keyboard broadcasts its own access
        point and `wifi` once it has joined a network. `config` is what
        was last saved here, which is not necessarily what is running:
        a network that couldn't be joined leaves the configuration in
        place and the hotspot up.

        `available` is `false` off the device — the helper this reads
        through only exists on the keyboard — and then `config` is all
        that comes back.

        The key is never returned. `config.secured` says whether there
        is one.
      operationId: getNetwork
      responses:
        "200":
          description: The interface's state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkStatus"

    put:
      tags: [Network]
      summary: Save the network to join
      description: |
        Stored on the data partition, so it survives a reflash, and
        applied about a second after this answers — long enough for the
        answer to leave, since applying it drops the interface the caller
        is most likely on. The caller should expect the connection to go
        away and to come back on the new address.

        A key of between 8 and 63 characters, WPA2's own range. Sending
        an empty one declares an open network; leaving `passphrase` out
        of the body altogether keeps the one already saved, since it is
        never sent back out and could not otherwise be left alone.

        A static configuration needs at least an address and a netmask;
        the gateway and the two DNS servers are optional, since a
        keyboard on a network with no route out still answers on it.
      operationId: setNetwork
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkWrite"
      responses:
        "200":
          description: Saved, and queued to be applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  config:
                    $ref: "#/components/schemas/NetworkConfig"
        "400":
          description: |
            An SSID outside 1–32 characters, a key outside 8–63, an IPv4
            mode other than `dhcp`/`static`, a static configuration
            missing its address or netmask, or an address, netmask,
            gateway or DNS server that isn't one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/network/scan:
    post:
      tags: [Network]
      summary: The networks in range
      description: |
        Strongest first, iwd's own ordering, one entry per SSID. Takes a
        few seconds: the radio has to scan. Works while the hotspot is up,
        which is the point of it — the network to join is picked from a
        browser attached to that hotspot, over the same radio.

        An empty list off the device, and also when the scan itself
        failed: a scan that found nothing and a scan that couldn't run are
        not told apart.
      operationId: scanNetworks
      responses:
        "200":
          description: What the radio saw.
          content:
            application/json:
              schema:
                type: object
                properties:
                  networks:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScannedNetwork"

  /api/agent:
    get:
      tags: [Agent]
      summary: Is an agent connected?
      description: |
        Same 30-second staleness window as the device. The agent's host,
        port and token are deliberately never returned.
      operationId: getAgent
      responses:
        "200":
          description: The agent's state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatus"

  /api/agent/register:
    post:
      tags: [Agent]
      summary: Register an agent
      description: |
        Called by the KBRD Agent on the paired machine. Its host is taken
        from the request itself, not from the body. The `token` it hands
        over is what this service then presents when calling the agent
        back, so it is stored but never handed out again.
      operationId: registerAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [port, token, name]
              properties:
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                token:
                  type: string
                  description: Bearer token for calls back to the agent.
                name:
                  type: string
                platform:
                  type: string
                version:
                  type: string
      responses:
        "200":
          description: Registered.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      ok:
                        type: boolean
                  - $ref: "#/components/schemas/AgentIdentity"
        "400":
          description: |
            A port outside 1-65535, or a missing token or name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/applications:
    get:
      tags: [Agent]
      summary: Applications the paired machine can launch
      description: Proxied to the registered agent.
      operationId: listApplications
      responses:
        "200":
          description: Whatever the agent answered.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    canQuit:
                      type: boolean
        "502":
          $ref: "#/components/responses/AgentUnreachable"
        "503":
          $ref: "#/components/responses/AgentUnavailable"

  /api/applications/{application_id}/launch:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      tags: [Agent]
      summary: Launch an application
      operationId: launchApplication
      responses:
        "200":
          description: Whatever the agent answered.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: An empty application id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/AgentUnreachable"
        "503":
          $ref: "#/components/responses/AgentUnavailable"

  /api/applications/{application_id}/quit:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      tags: [Agent]
      summary: Quit an application
      operationId: quitApplication
      responses:
        "200":
          description: Whatever the agent answered.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: An empty application id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/AgentUnreachable"
        "503":
          $ref: "#/components/responses/AgentUnavailable"

  /api/browsers:
    get:
      tags: [Agent]
      summary: Browsers the paired machine can open a URL with
      description: Proxied to the registered agent.
      operationId: listBrowsers
      responses:
        "200":
          description: Whatever the agent answered.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
        "502":
          $ref: "#/components/responses/AgentUnreachable"
        "503":
          $ref: "#/components/responses/AgentUnavailable"

  /api/browsers/{browser_id}/open:
    parameters:
      - name: browser_id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Agent]
      summary: Open a URL in a browser
      operationId: openBrowser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  example: https://kbrd.dev
      responses:
        "200":
          description: Whatever the agent answered.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: An empty browser id, or a missing URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/AgentUnreachable"
        "503":
          $ref: "#/components/responses/AgentUnavailable"

  /api/backup:
    get:
      tags: [Backup]
      summary: Download a backup of the device
      description: |
        A ZIP holding the database as `database.db` and every media file
        under `media/`. The database is read through SQLite rather than
        copied off the disk, so what comes back is a consistent image of
        every table even if something is being written while it is taken.

        Served as an attachment named `kbrd-backup-<date>-<time>.zip`.
      operationId: downloadBackup
      responses:
        "200":
          description: The archive.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "500":
          description: The archive could not be built.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/backup/restore:
    post:
      tags: [Backup]
      summary: Restore the device from a backup
      description: |
        Replaces the database *and* the media library with the uploaded
        archive's — every layout, layer, key and media on the device is
        whatever the backup held, and everything since is gone. There is no
        undo, and no confirmation here: KBRD-WEB asks before sending.

        The archive is unpacked beside what it is replacing and its
        database is opened before anything is moved, so one that isn't an
        archive, holds no `database.db`, or holds one that isn't a
        readable KBRD database is refused with the device untouched. A
        backup taken by an older KBRD is brought up to the current schema
        by the same migrations a startup runs.

        Only `database.db` and plain files directly under `media/` are
        unpacked; any other entry is ignored.
      operationId: restoreBackup
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: |
            Restored. The database and the media library are the archive's.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: |
            No file, a file that is not an archive, an archive with no
            database in it, or one whose database is not a readable KBRD
            database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The database or the media library could not be replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:

  parameters:

    LayoutId:
      name: layout_id
      in: path
      required: true
      schema:
        type: integer

    LayerId:
      name: layer_id
      in: path
      required: true
      schema:
        type: integer

    KeyRef:
      name: key_ref
      in: path
      required: true
      description: |
        The key's own identifier within its layer — a string KBRD-WEB
        assigns and this service only ever stores and matches on.
      schema:
        type: string

    ApplicationId:
      name: application_id
      in: path
      required: true
      description: |
        Declared `path` in Flask, so an id containing slashes (a bundle
        path, say) travels intact.
      schema:
        type: string

  responses:

    Ok:
      description: Done.
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
                example: true

    BadRequest:
      description: The body was missing something, or was the wrong shape.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: No such record.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    AgentUnavailable:
      description: No agent is registered, or its registration is stale.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    AgentUnreachable:
      description: An agent is registered but could not be reached.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:

    Error:
      type: object
      properties:
        error:
          type: string
      example:
        error: not found

    Media:
      type: object
      description: One image or video the Media panel's library holds.
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [photo, video]
        category_id:
          type: integer
        filename:
          type: string
          description: |
            The generated name the file is stored under, and what
            `GET /api/media/{filename}` serves it back from.
          example: 4f1c9e7a2b0d4e5f8a1b2c3d4e5f6a7b.png
        name:
          type: string
          description: The name the file was dropped under.
          example: logo.png
        created_at:
          type: string

    MediaCategory:
      type: object
      description: A label the Media panel files an image or a video under.
      properties:
        id:
          type: integer
        name:
          type: string
        created_at:
          type: string
      example:
        id: 1
        name: Icons
        created_at: "2026-01-14 09:12:03"

    MediaCategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Trimmed, and unique across every category.
      example:
        name: Icons

    Layout:
      type: object
      description: A keyboard, and the geometry KBRD-WEB draws it at.
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        author:
          type: string
        unit:
          type: string
          enum: [px, mm]
        active:
          type: boolean
        created_at:
          type: string
        unit_mm:
          type: number
          description: A keycap's own size — Settings › Geometry's Caps size.
        gap_mm:
          type: number
          description: The gap between two keycaps.
        max_columns:
          type: number
          nullable: true
          description: |
            How many 1U items fit across; `null` means "as many as fit",
            which KBRD-WEB computes and clamps to itself.
        max_rows:
          type: number
          nullable: true

    LayoutWrite:
      type: object
      required: [name, unit]
      properties:
        name:
          type: string
        description:
          type: string
        author:
          type: string
        unit:
          type: string
          enum: [px, mm]
        unit_mm:
          type: number
          default: 19.05
        gap_mm:
          type: number
          default: 3
        max_columns:
          type: number
          nullable: true
          minimum: 1
        max_rows:
          type: number
          nullable: true
          minimum: 1

    Layer:
      type: object
      description: One layout's grid, without what's mapped onto it.
      properties:
        id:
          type: integer
        layout_id:
          type: integer
        name:
          type: string
        description:
          type: string
        active:
          type: boolean
        created_at:
          type: string
        factory_layout:
          description: |
            KBRD-WEB's own grid disposition — rows, cells, merges,
            divisions. Opaque here.
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"

    LayerDetail:
      allOf:
        - $ref: "#/components/schemas/Layer"
        - type: object
          description: A layer with everything mapped onto it.
          properties:
            plugins:
              type: array
              items:
                $ref: "#/components/schemas/KeyPlugin"
            key_properties:
              type: array
              items:
                $ref: "#/components/schemas/KeyProperty"

    LayerWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    NamedCopy:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    ReplaceSource:
      type: object
      required: [source_id]
      properties:
        source_id:
          type: integer
          description: What to copy from. May not be the target itself.

    PluginConfig:
      type: object
      additionalProperties: true
      description: |
        A plugin instance's own settings, whose shape each plugin's
        manifest defines (see `kbrd-plugins/src/*/plugin.json`). Stored
        and returned verbatim — this service never looks inside one,
        except to spot the media filenames it references so uploads can be
        reference-counted.

    KeyPlugin:
      type: object
      description: One plugin attached to one key.
      properties:
        id:
          type: integer
        layer_id:
          type: integer
        key_ref:
          type: string
        plugin_id:
          type: string
          example: kbrd.render-label
        plugin_version:
          type: string
        position:
          type: integer
          description: Draw order within the key; last is on top.
        enabled:
          type: boolean
        config:
          $ref: "#/components/schemas/PluginConfig"

    KeyProperty:
      type: object
      description: A key's own config, as opposed to any plugin's.
      properties:
        key_ref:
          type: string
        config:
          $ref: "#/components/schemas/PluginConfig"

    Display:
      type: object
      properties:
        physical_width_mm:
          type: number
          default: 216
        physical_height_mm:
          type: number
          default: 135
        name:
          type: string
          description: |
            Which screen this is, as the setup wizard was told. Empty on a
            device that has never been through it. `PUT /api/display`
            doesn't touch it: a size changed by hand in Settings says
            nothing about which panel was declared.
        brand:
          type: string
          description: |
            Only set when the screen was picked out of KBRD-WEB's own
            list of known panels; empty for one described by hand.
        model:
          type: string

    DisplayWrite:
      type: object
      description: A screen, as the setup wizard declares it.
      required: [name, physical_width_mm, physical_height_mm]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        brand:
          type: string
          maxLength: 64
        model:
          type: string
          maxLength: 64
        physical_width_mm:
          type: number
          minimum: 10
          maximum: 2000
        physical_height_mm:
          type: number
          minimum: 10
          maximum: 2000

    DeviceSize:
      type: object
      properties:
        width:
          type: integer
        height:
          type: integer
        width_mm:
          type: integer
          nullable: true
        height_mm:
          type: integer
          nullable: true

    DeviceStatus:
      allOf:
        - type: object
          properties:
            connected:
              type: boolean
        - $ref: "#/components/schemas/DeviceSize"

    StoragePartition:
      type: object
      properties:
        name:
          type: string
          description: What KBRD-WEB labels the partition, e.g. `Data`.
        mount:
          type: string
          description: Where it is mounted, e.g. `/data`.
        total:
          type: integer
          format: int64
          description: The filesystem's size, in bytes.
        used:
          type: integer
          format: int64
          description: Bytes in use, measured against the whole filesystem.
        free:
          type: integer
          format: int64
          description: |
            Bytes still writable. `used` + `free` falls short of `total` by
            the slice ext4 reserves for root.

    AgentIdentity:
      type: object
      properties:
        name:
          type: string
        platform:
          type: string
        version:
          type: string

    AgentStatus:
      allOf:
        - type: object
          properties:
            connected:
              type: boolean
        - $ref: "#/components/schemas/AgentIdentity"

    NetworkIpv4:
      type: object
      properties:
        address:
          type: string
          description: The address on the interface, empty while there is none.
        netmask:
          type: string
        gateway:
          type: string
          description: The default route, empty when the network offers none.
        dns:
          type: array
          items:
            type: string
          description: The resolvers in use, at most two.

    NetworkIpv4Config:
      type: object
      properties:
        mode:
          type: string
          enum: [dhcp, static]
        address:
          type: string
        netmask:
          type: string
        gateway:
          type: string
        dns1:
          type: string
        dns2:
          type: string

    NetworkConfig:
      type: object
      description: What was last saved, never what is running.
      properties:
        ssid:
          type: string
        secured:
          type: boolean
          description: |
            Whether a key was saved. The key itself is never returned.
        ipv4:
          $ref: "#/components/schemas/NetworkIpv4Config"

    NetworkStatus:
      type: object
      properties:
        available:
          type: boolean
          description: |
            `false` off the device, where only `config` is answered.
        interface:
          type: string
          description: The Wi-Fi interface, `wlan0` on a CM4.
        mode:
          type: string
          enum: [wifi, hotspot, unknown]
        connected:
          type: boolean
          description: |
            An access point that is broadcasting, or a network that has
            been joined and has an address.
        ssid:
          type: string
          description: |
            The network joined, or the access point's own name while the
            hotspot is up.
        ipv4:
          $ref: "#/components/schemas/NetworkIpv4"
        hotspot:
          type: object
          description: |
            The access point this keyboard falls back to: the name it
            broadcasts, and the address it answers on.
          properties:
            ssid:
              type: string
            address:
              type: string
        config:
          $ref: "#/components/schemas/NetworkConfig"

    NetworkWrite:
      type: object
      required: [ssid]
      properties:
        ssid:
          type: string
          minLength: 1
          maxLength: 32
        passphrase:
          type: string
          description: |
            8 to 63 characters; empty for an open network. Write-only —
            leave the property out entirely to keep the saved key.
        ipv4:
          $ref: "#/components/schemas/NetworkIpv4Config"

    ScannedNetwork:
      type: object
      properties:
        ssid:
          type: string
        security:
          type: string
          description: |
            As iwd names it — `psk`, `open`, `8021x`, `wep (unsupported)`.
